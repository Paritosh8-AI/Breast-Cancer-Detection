version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cancer_sentinel_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CANCER_AI_ENVIRONMENT=production
      - CANCER_AI_HOST=0.0.0.0
      - CANCER_AI_PORT=8000
    volumes:
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cancer_net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cancer_sentinel_dashboard
    restart: unless-stopped
    command: ["streamlit", "run", "cancer_ai/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - CANCER_AI_ENVIRONMENT=production
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./assets:/app/assets:ro
    networks:
      - cancer_net

networks:
  cancer_net:
    driver: bridge
